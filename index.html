<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Florbal Scoreboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <section id="board" class="board" aria-live="polite">
      <div class="team" data-team="home">
        <div class="team-name" data-bind="name"></div>
        <div class="score" data-bind="score">0</div>
        <div class="team-meta">
          <span data-bind="shots"></span>
          <span class="to-badge" data-bind="timeout">TO</span>
        </div>
        <ul class="pen-list" data-bind="pens"></ul>
      </div>

      <div class="center">
        <div class="period" id="period"></div>
        <div class="clock" id="clock">20:00</div>
        <div class="strength" id="strength"></div>
        <div class="aux" id="aux"></div>
      </div>

      <div class="team" data-team="away">
        <div class="team-name" data-bind="name"></div>
        <div class="score" data-bind="score">0</div>
        <div class="team-meta">
          <span data-bind="shots"></span>
          <span class="to-badge" data-bind="timeout">TO</span>
        </div>
        <ul class="pen-list" data-bind="pens"></ul>
      </div>
    </section>

    <section id="controls" class="controls">
      <div class="panel clock-panel">
        <button class="big primary" data-action="toggle-clock" id="toggle-clock" title="Space">Start</button>
        <div class="btn-row">
          <button data-action="adjust" data-ms="-60000">−1m</button>
          <button data-action="adjust" data-ms="-10000">−10s</button>
          <button data-action="adjust" data-ms="-1000">−1s</button>
          <button data-action="adjust" data-ms="1000">+1s</button>
          <button data-action="adjust" data-ms="10000">+10s</button>
          <button data-action="adjust" data-ms="60000">+1m</button>
          <button data-action="set-clock">Set…</button>
        </div>
        <div class="btn-row">
          <button data-action="toggle-aux" id="toggle-aux">Pause break</button>
          <button data-action="end-aux" id="end-aux">End break</button>
          <button data-action="intermission">Intermission</button>
          <button data-action="next-period" id="next-period">Next period</button>
          <button data-action="end-match" id="end-match">End match</button>
        </div>
        <div class="btn-row">
          <button data-action="buzzer" title="B">Buzzer</button>
          <button data-action="open-display">Open display window</button>
          <button data-action="fullscreen" title="F">Fullscreen board</button>
        </div>
      </div>

      <div class="teams-panels">
        <div class="panel team-panel" data-team="home">
          <div class="team-edit">
            <input class="name-input" data-field="name" maxlength="20" aria-label="Home team name">
            <input type="color" data-field="color" aria-label="Home team color">
          </div>
          <div class="btn-row">
            <button class="big goal" data-action="goal" title="Q">Goal +</button>
            <button data-action="goal-minus">−</button>
          </div>
          <div class="btn-row">
            <button data-action="shot" data-delta="1" title="A">Shot +</button>
            <button data-action="shot" data-delta="-1">Shot −</button>
            <button data-action="timeout">Timeout</button>
          </div>
          <form class="pen-form">
            <input name="player" placeholder="#" inputmode="numeric" maxlength="3" aria-label="Player number">
            <select name="type" aria-label="Penalty type">
              <option value="2">2'</option>
              <option value="2+2">2+2'</option>
              <option value="5">5'</option>
              <option value="10">10' (personal)</option>
              <option value="MP">Match penalty</option>
            </select>
            <input name="reason" list="reasons" placeholder="Reason" aria-label="Reason">
            <button type="submit">Penalty</button>
          </form>
          <ul class="pen-list ctrl" data-bind="ctrl-pens"></ul>
        </div>

        <div class="panel team-panel" data-team="away">
          <div class="team-edit">
            <input class="name-input" data-field="name" maxlength="20" aria-label="Away team name">
            <input type="color" data-field="color" aria-label="Away team color">
          </div>
          <div class="btn-row">
            <button class="big goal" data-action="goal" title="P">Goal +</button>
            <button data-action="goal-minus">−</button>
          </div>
          <div class="btn-row">
            <button data-action="shot" data-delta="1" title="L">Shot +</button>
            <button data-action="shot" data-delta="-1">Shot −</button>
            <button data-action="timeout">Timeout</button>
          </div>
          <form class="pen-form">
            <input name="player" placeholder="#" inputmode="numeric" maxlength="3" aria-label="Player number">
            <select name="type" aria-label="Penalty type">
              <option value="2">2'</option>
              <option value="2+2">2+2'</option>
              <option value="5">5'</option>
              <option value="10">10' (personal)</option>
              <option value="MP">Match penalty</option>
            </select>
            <input name="reason" list="reasons" placeholder="Reason" aria-label="Reason">
            <button type="submit">Penalty</button>
          </form>
          <ul class="pen-list ctrl" data-bind="ctrl-pens"></ul>
        </div>
      </div>

      <div class="panel">
        <h2>Match log</h2>
        <p class="period-scores" id="period-scores"></p>
        <table class="log">
          <thead><tr><th>Per.</th><th>Time</th><th>Event</th><th></th></tr></thead>
          <tbody id="log"></tbody>
        </table>
        <div class="btn-row">
          <button data-action="export">Download report</button>
          <button data-action="new-match" class="danger">New match</button>
        </div>
      </div>

      <details class="panel">
        <summary>Settings</summary>
        <div class="settings">
          <label>Periods <input type="number" min="1" max="5" data-setting="periods"></label>
          <label>Period length (min) <input type="number" min="1" max="60" data-setting="periodMin"></label>
          <label>Intermission (min) <input type="number" min="0" max="30" data-setting="intermissionMin"></label>
          <label>Overtime (min, 0 = none) <input type="number" min="0" max="20" data-setting="otMin"></label>
          <label>Timeout (s) <input type="number" min="10" max="120" data-setting="timeoutSec"></label>
          <label class="check"><input type="checkbox" data-setting="buzzer"> Buzzer sound</label>
        </div>
        <p class="hint">
          Shortcuts: <kbd>Space</kbd> start/stop · <kbd>Q</kbd>/<kbd>P</kbd> goal home/away ·
          <kbd>A</kbd>/<kbd>L</kbd> shot home/away · <kbd>B</kbd> buzzer · <kbd>F</kbd> fullscreen
        </p>
      </details>
    </section>
  </main>

  <datalist id="reasons">
    <option value="Hitting">
    <option value="Hooking">
    <option value="Blocking">
    <option value="Kicking">
    <option value="Holding">
    <option value="Obstruction">
    <option value="High stick">
    <option value="Incorrect distance">
    <option value="Playing without stick">
    <option value="Leg/knee play">
    <option value="Too many players">
    <option value="Incorrect substitution">
    <option value="Delay of game">
    <option value="Protest">
    <option value="Unsportsmanlike behaviour">
    <option value="Dangerous play">
  </datalist>

  <dialog id="goal-dialog">
    <form method="dialog">
      <h2 id="goal-title">Goal</h2>
      <label>Scorer # <input name="scorer" inputmode="numeric" maxlength="3" autocomplete="off"></label>
      <label>Assist # <input name="assist" inputmode="numeric" maxlength="3" autocomplete="off"></label>
      <div class="btn-row">
        <button value="ok" class="primary">Save</button>
        <button type="button" data-close>Skip</button>
      </div>
    </form>
  </dialog>

  <script src="js/logic.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
